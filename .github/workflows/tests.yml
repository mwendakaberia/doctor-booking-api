
name: Doctor Booking API Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: doctor_api
          POSTGRES_PASSWORD: 7mwepaka
          POSTGRES_DB: doctor_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doctor_api -d doctor_booking_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://doctor_api:7mwepaka@localhost:5432/doctor_booking_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v
